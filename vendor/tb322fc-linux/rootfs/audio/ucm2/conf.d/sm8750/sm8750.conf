Syntax 4

# EFI SMBIOS can replace CardLongName; the board's CardName remains stable.
If.Y700Gen4 {
	Condition {
		Type String
		String1 "${CardName}"
		String2 "Lenovo-Y700-Gen4"
	}
	True.Include.y700.File "/conf.d/sm8750/Lenovo-Y700-Gen4.conf"
	False.Error "No board UCM for sm8750 card ${CardName}"
}
